name: ci

on:
  push:
    branches: [develop, main]
  pull_request:
  workflow_call:          # lets release.yml gate on this workflow before building

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v4
        with:
          install_args: rust
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings   # [lints.clippy] pedantic in Cargo.toml makes this enforce pedantic
      - run: cargo test
      - run: cargo build

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v4
        with:
          install_args: "rust cargo:cargo-audit"
      - run: cargo audit

  coverage:
    if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v4
        with:
          install_args: "rust aqua:taiki-e/cargo-llvm-cov"
      - uses: Swatinem/rust-cache@v2
      - run: mise run coverage   # writes codecov.json; glue files excluded (see mise.toml regex)
      - name: Upload to Codecov
        uses: codecov/codecov-action@v7
        with:
          files: target/codecov.json
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false   # a Codecov outage (or missing token) must not fail the gate

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v4
        with:
          install_args: "rust aqua:bats-core/bats-core"
      - uses: Swatinem/rust-cache@v2
      - run: command -v zsh || { sudo apt-get update && sudo apt-get install -y zsh; }   # for the zsh-integration tests
      - run: cargo build
      - run: mise run e2e
        env:
          MISE_TASK_RUN_AUTO_INSTALL: 'false'   # bats is already installed above; don't pull the full toolchain
