[settings]
disable_backends = ["ubi", "asdf"]
lockfile = true

[tools]
rust = { version = "1.100.0", components = "rustfmt,clippy,llvm-tools" }
node = "26.13.1"
"aqua:bats-core/bats-core" = "1.14.0"
"aqua:gittower/git-flow-next" = "2.1.0"
"aqua:j178/prek" = "0.5.10"
"aqua:nektos/act" = "0.2.97"
"aqua:orhun/git-cliff" = "2.14.2"
"aqua:rhysd/actionlint" = "1.7.12"
"aqua:taiki-e/cargo-llvm-cov" = "0.9.1"
"cargo:cargo-audit" = { version = "0.23.0", locked = true }
"npm:@fission-ai/openspec" = "2.0.0"

[env]
OPENSPEC_TELEMETRY = "0"
