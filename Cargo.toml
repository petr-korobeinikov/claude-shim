[package]
name = "claude-shim"
version = "2026.8.0"
edition = "2024"
description = "Claude Code profile manager. Combat-proven. Automagic."
license = "MIT"
authors = ["Petr Korobeinikov"]
repository = "https://github.com/petr-korobeinikov/claude-shim"
homepage = "https://petr-korobeinikov.com/projects/oss/claude-shim/"
documentation = "https://petr-korobeinikov.github.io/claude-shim/"
readme = "README.md"
keywords = ["claude", "claude-code", "cli", "profile", "shim"]
categories = ["command-line-utilities", "development-tools", "config"]
include = ["/src/**", "/README.md", "/LICENSE"]

[dependencies]
clap = { version = "4.6.1", features = ["derive"] }
directories = "6.0.0"
serde_json = { version = "1.0", features = ["preserve_order"] }

[dev-dependencies]
tempfile = "3.27.0"

[profile.release]
# Strip the symbol table from shipped binaries; the release profile emits no debuginfo anyway.
strip = true

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
